name: Deploy Backend

on:
  push:
    branches: [master]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: backend/tareas-db
  ECR_REPO: tareas-db

jobs:
  test:
    name: Tests con PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17          # misma versión mayor que Aurora
        env:
          POSTGRES_DB: tareas
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app123
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d tareas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tareas
      DB_USER: app
      DB_PASSWORD: app123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
          cache: maven

      - name: Tests
        working-directory: ${{ env.APP_DIR }}
        run: ./mvnw -B verify

  imagen:
    name: Imagen Docker a ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      imagen: ${{ steps.datos.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar credenciales
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$SECRET" ] || { echo "::error::Faltan los secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Nombre de la imagen
        id: datos
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "imagen=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:$TAG" >> "$GITHUB_OUTPUT"
          # Los tags son inmutables: si este commit ya tiene imagen (re-ejecución), no se vuelve a construir
          if aws ecr describe-images --repository-name "${{ env.ECR_REPO }}" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
            echo "La imagen $TAG ya existe en ECR"
          fi

      # QEMU + Buildx: construir una imagen arm64 (la EC2 es Graviton) desde un runner amd64
      - uses: docker/setup-qemu-action@v3
        if: steps.datos.outputs.existe != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.datos.outputs.existe != 'true'

      - name: Construir y subir
        if: steps.datos.outputs.existe != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          platforms: linux/arm64
          push: true
          provenance: false        # evita un manifiesto extra en ECR
          tags: ${{ steps.datos.outputs.imagen }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy a EC2
    needs: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar configuración
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
          CF: ${{ vars.CF_DOMAIN }}
        run: |
          faltan=0
          [ -n "$INSTANCE" ] || { echo "::error::Falta la variable EC2_INSTANCE_ID"; faltan=1; }
          [ -n "$CF" ]       || { echo "::error::Falta la variable CF_DOMAIN"; faltan=1; }
          [ "$faltan" -eq 0 ] || exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Desplegar contenedor en EC2 vía SSM
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
          IMAGEN: ${{ needs.imagen.outputs.imagen }}
        run: |
          # El script se envía completo: la EC2 no necesita tener nada preinstalado
          sed "s|__IMAGEN__|$IMAGEN|" "$APP_DIR/deploy/deploy-contenedor.sh" \
            | jq -Rs '{commands: [.], executionTimeout: ["600"]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "Deploy contenedor ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "Comando SSM: $CMD_ID"

          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query "[StandardOutputContent,StandardErrorContent]" --output text
          echo "Estado final: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Smoke test vía CloudFront
        run: |
          CF="https://${{ vars.CF_DOMAIN }}"

          # El health es público: debe responder 200
          curl -sf --retry 5 --retry-delay 5 "$CF/tareas-db/api/health"
          echo

          # La API exige token: sin él debe responder 401
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$CF/tareas-db/api/v1/tareas?size=1")
          echo "Sin token → HTTP $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::Se esperaba 401 (API protegida con Cognito) y llegó $CODE"
            exit 1
          fi