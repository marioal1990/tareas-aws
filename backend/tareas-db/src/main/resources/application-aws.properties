# Aurora PostgreSQL Express con autenticación IAM (sin contraseña)
spring.datasource.url=jdbc:aws-wrapper:postgresql://${RDS_DB_HOST}:5432/${RDS_DB_NAME}?wrapperPlugins=iam&sslmode=require
spring.datasource.driver-class-name=software.amazon.jdbc.Driver
spring.datasource.username=${RDS_DB_USER}

# Pool que se vacía cuando no hay uso, para que Aurora pueda apagarse (scale to zero)
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

#EVENTOS
eventos.habilitados=true