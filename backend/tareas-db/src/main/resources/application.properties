spring.application.name=tareas-db
spring.main.banner-mode=off
server.port=8888
server.servlet.context-path=/tareas-db

#POOL DE CONEXIONES (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=tareas-db-pool

#POSTGRESQL 18
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate schema generation/application none, update or validate
spring.jpa.hibernate.ddl-auto=validate

#FLYWAY
spring.flyway.schemas=public
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.table=flyway_schema_history


#ACTUATOR
# Health check en /api/health (lo usará CloudFront/monitoreo después)
management.endpoints.web.base-path=/api

#PAGEABLES
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

spring.jackson.deserialization.fail-on-null-for-primitives=false

#COGNITO (no son secretos: issuer y client id son públicos)
cognito.issuer=${COGNITO_ISSUER}
cognito.client-id=${COGNITO_CLIENT_ID}