<main class="contenedor">
  <h1>Mis tareas</h1>

  <form class="nueva" (ngSubmit)="agregar()">
    <input [(ngModel)]="nueva" name="nueva" placeholder="Nueva tarea" maxlength="200" />
    <button type="submit" class="btn btn-primary" [disabled]="!nueva.trim()">Agregar</button>
  </form>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <ul class="lista">
    @for (t of tareas(); track t.id) {
      <li [class.hecha]="t.completada">
        <span>{{ t.titulo }}</span>
        <small>{{ t.creadaEn | date: 'dd-MM-yyyy HH:mm' }}</small>
        <button class="btn btn-danger btn-sm" (click)="borrar(t.id!)" aria-label="Eliminar">✕</button>
      </li>
    } @empty {
      <li>No hay tareas.</li>
    }
  </ul>

  <nav class="paginacion">
    <button class="btn btn-outline-primary" (click)="cambiarPagina(-1)" [disabled]="pagina() === 1">Anterior</button>
    <span>Página {{ pagina() }}</span>
    <button class="btn btn-outline-primary" (click)="cambiarPagina(1)" [disabled]="!hayMas()">Siguiente</button>
  </nav>
</main>
