AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Microservicio de comentarios para tareas (Lambda Java 21 + DynamoDB)

Parameters:
  CognitoIssuer:
    Type: String
    Default: https://cognito-idp.us-east-2.amazonaws.com/us-east-2_nckcMjeDK
  CognitoClientId:
    Type: String
    Default: 5lggp4fqhicqc5mdrqf0hvile3

Globals:
  Function:
    Runtime: java21
    Architectures: [arm64]          # Graviton: ~20% más barato
    MemorySize: 1024
    Timeout: 10
    AutoPublishAlias: live          # SnapStart funciona sobre versiones publicadas
    SnapStart:
      ApplyOn: PublishedVersions
    Environment:
      Variables:
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"

Resources:
  ComentariosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tareas-comentarios
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: tareaId, AttributeType: N }
        - { AttributeName: comentarioId, AttributeType: S }
      KeySchema:
        - { AttributeName: tareaId, KeyType: HASH }        # partición: una tarea
        - { AttributeName: comentarioId, KeyType: RANGE }  # orden: por fecha

  ComentariosApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref CognitoIssuer
              audience:
                - !Ref CognitoClientId   # API Gateway lo compara con el claim client_id

  ComentariosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tareas-comentarios
      CodeUri: function/
      Handler: cl.mario.comentarios.Handler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref ComentariosTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ComentariosTable     # mínimo privilegio: solo esta tabla
      Events:
        Listar:
          Type: HttpApi
          Properties:
            ApiId: !Ref ComentariosApi
            Path: /comentarios-api/tareas/{tareaId}/comentarios
            Method: GET
        Crear:
          Type: HttpApi
          Properties:
            ApiId: !Ref ComentariosApi
            Path: /comentarios-api/tareas/{tareaId}/comentarios
            Method: POST
        Borrar:
          Type: HttpApi
          Properties:
            ApiId: !Ref ComentariosApi
            Path: /comentarios-api/tareas/{tareaId}/comentarios/{comentarioId}
            Method: DELETE

  ComentariosLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tareas-comentarios
      RetentionInDays: 7                          # no acumular logs para siempre

  LimpiezaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tareas-comentarios-limpieza
      CodeUri: function/
      Handler: cl.mario.comentarios.LimpiezaHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref ComentariosTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ComentariosTable
      Events:
        TareaEliminada:
          Type: EventBridgeRule
          Properties:
            Pattern: # solo recibe estos eventos
              source: [ tareas-db ]
              detail-type: [ TareaEliminada ]
            RetryPolicy:
              MaximumRetryAttempts: 5
              MaximumEventAgeInSeconds: 3600

  LimpiezaLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tareas-comentarios-limpieza
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Value: !Sub "https://${ComentariosApi}.execute-api.${AWS::Region}.amazonaws.com"
  ApiDomain:
    Description: Dominio para usar como origen en CloudFront
    Value: !Sub "${ComentariosApi}.execute-api.${AWS::Region}.amazonaws.com"